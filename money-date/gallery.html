<!DOCTYPE html>
<html>
<head>
  <title>Asset Gallery</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; }
    h1 { text-align: center; color: #FFA300; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background: #222; border: 1px solid #333; border-radius: 8px; padding: 15px; text-align: center; }
    .img-container { background: #333; border-radius: 4px; padding: 10px; margin-bottom: 10px; min-height: 150px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    img { max-width: 100%; max-height: 180px; object-fit: contain; }
    .info { font-size: 0.85em; color: #ccc; margin-top: 5px; }
  </style>
</head>
<body>
  <h1>Money Date 2.0 Asset Gallery</h1>
  <div class="grid" id="gallery"></div>
  <script>
    const assets = [
      { name: "Asset 1@4x.png", w: 5573, h: 445 },
      { name: "Asset 2@4x.png", w: 5573, h: 445 },
      { name: "Asset 3@4x.png", w: 5573, h: 444 },
      { name: "Asset 4@4x.png", w: 1331, h: 424 },
      { name: "Asset 5@4x.png", w: 1331, h: 424 },
      { name: "Asset 6@4x.png", w: 1331, h: 424 },
      { name: "Asset 7@4x.png", w: 1331, h: 424 },
      { name: "Asset 8@4x.png", w: 897, h: 897 },
      { name: "Asset 9@4x.png", w: 897, h: 897 },
      { name: "Asset 10@4x.png", w: 896, h: 897 },
      { name: "Asset 11@4x.png", w: 896, h: 897 },
      { name: "Asset 12@4x.png", w: 896, h: 897 },
      { name: "Asset 13@4x.png", w: 897, h: 897 },
      { name: "Asset 14@4x.png", w: 896, h: 897 },
      { name: "Asset 15@4x.png", w: 898, h: 897 },
      { name: "Asset 16@4x.png", w: 1070, h: 202 },
      { name: "Asset 17@4x.png", w: 1070, h: 201 },
      { name: "Asset 18@4x.png", w: 1349, h: 1667 },
      { name: "Asset 19@4x.png", w: 370, h: 193 },
      { name: "Asset 20@4x.png", w: 370, h: 194 },
      { name: "Asset 21@4x.png", w: 371, h: 194 },
      { name: "Asset 22@4x.png", w: 1070, h: 201 },
      { name: "Asset 23@4x.png", w: 1070, h: 201 }
    ];
    
    const container = document.getElementById("gallery");
    assets.forEach(a => {
      const card = document.createElement("div");
      card.className = "card";
      
      const imgCont = document.createElement("div");
      imgCont.className = "img-container";
      
      const img = document.createElement("img");
      img.src = "public/assets/" + a.name;
      img.alt = a.name;
      
      imgCont.appendChild(img);
      card.appendChild(imgCont);
      
      const title = document.createElement("div");
      title.style.fontWeight = "bold";
      title.innerText = a.name;
      card.appendChild(title);
      
      const info = document.createElement("div");
      info.className = "info";
      info.innerText = `${a.w} x ${a.h} (Aspect: ${(a.w/a.h).toFixed(2)})`;
      card.appendChild(info);
      
      container.appendChild(card);
    });
  </script>
</body>
</html>
